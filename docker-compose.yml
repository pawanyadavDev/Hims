services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hims
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/002_opd.sql:/docker-entrypoint-initdb.d/02-opd.sql:ro
      - ./database/migrations/003_pharmacy.sql:/docker-entrypoint-initdb.d/03-pharmacy.sql:ro
      - ./database/migrations/004_lab.sql:/docker-entrypoint-initdb.d/04-lab.sql:ro
      - ./database/migrations/005_ipd.sql:/docker-entrypoint-initdb.d/05-ipd.sql:ro
      - ./database/migrations/006_inventory.sql:/docker-entrypoint-initdb.d/06-inventory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hims"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://hims_app:${APP_DB_PASSWORD}@db:5432/hims
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
